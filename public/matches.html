<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>받은 매칭 — 설렘</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --coral: #FF5A78; --plum: #1A0F18; --plum-2: #4A3540;
      --bg: #F7F3EE; --surface: #fff; --sand-2: #E0D0C0;
      --primary: var(--coral); --text: var(--plum); --muted: #9A8674;
      --border: rgba(45,31,42,.14);
    }
    body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text); }
    .wrap { max-width: 480px; margin: 0 auto; padding: 20px; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .top h1 { font-size: 20px; font-weight: 800; }
    .top a { font-size: 13px; color: var(--primary); font-weight: 600; text-decoration: none; }
    .match-item {
      background: var(--surface); border-radius: 16px; padding: 14px;
      display: flex; gap: 14px; align-items: center; margin-bottom: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .avatar { width: 64px; height: 64px; border-radius: 50%; background: #eee center/cover; flex-shrink: 0; }
    .info { flex: 1; min-width: 0; }
    .name { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
    .meta { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .contact { font-size: 13px; color: var(--primary); font-weight: 600; word-break: break-all; }
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty .emo { font-size: 48px; margin-bottom: 12px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>💝 받은 매칭</h1>
    <a href="/match">매칭 계속하기 →</a>
  </div>
  <div id="list"></div>
</div>
<script>
const saved = JSON.parse(localStorage.getItem('charm_registrations') || '[]');
const auth = saved.length ? saved[saved.length - 1] : null;

if (!auth) {
  document.getElementById('list').innerHTML = `<div class="empty"><div class="emo">📝</div>먼저 사전등록이 필요해요.<br><a href="/" style="color:var(--primary)">홈으로</a></div>`;
} else {
  fetch('/api/matches/list', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ myId: auth.id, myToken: auth.deleteToken }),
  }).then(r => r.json()).then(data => {
    const list = data.matches || [];
    if (!list.length) {
      document.getElementById('list').innerHTML = `<div class="empty"><div class="emo">💭</div>아직 성사된 매칭이 없어요.<br>매칭 탭에서 좋아요를 보내보세요.</div>`;
      return;
    }
    const methodMap = { sms: '문자', kakao: '카카오톡', email: '이메일', manual: '직접 확인' };
    document.getElementById('list').innerHTML = list.map(m => `
      <div class="match-item">
        <div class="avatar" style="background-image:${m.photoUrl ? `url('${m.photoUrl}')` : 'none'}"></div>
        <div class="info">
          <div class="name">${escapeHtml(m.nickname)}</div>
          <div class="meta">${escapeHtml(m.city || '')} · ${new Date(m.matchedAt).toLocaleDateString('ko-KR')}</div>
          <div class="contact">${methodMap[m.contactMethod] || ''}: ${escapeHtml(m.contact || '')}</div>
        </div>
      </div>
    `).join('');
  });
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
