<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 — AI Charm Match</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #FF6B8A; --primary-light: #FFD6DF; --bg: #F8F9FC;
      --surface: #fff; --text: #1A1A2E; --text-secondary: #6B6B7B;
      --text-muted: #B0B0C0; --border: #EAECEF; --radius: 14px;
      --shadow: 0 2px 10px rgba(0,0,0,0.07);
    }
    body { font-family: 'Pretendard', -apple-system, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

    /* Login */
    #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-card { background: var(--surface); border-radius: var(--radius); padding: 40px 32px; max-width: 360px; width: 100%; box-shadow: var(--shadow); text-align: center; }
    .login-icon { font-size: 40px; margin-bottom: 16px; }
    .login-title { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .login-sub { font-size: 14px; color: var(--text-secondary); margin-bottom: 28px; }
    .login-input { width: 100%; border: 1.5px solid var(--border); border-radius: 10px; padding: 14px 16px; font-size: 15px; font-family: inherit; outline: none; transition: border-color 0.2s; }
    .login-input:focus { border-color: var(--primary); }
    .login-btn { width: 100%; background: var(--primary); color: #fff; border: none; border-radius: 10px; padding: 15px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 12px; transition: background 0.2s; }
    .login-btn:hover { background: #E84D6E; }

    /* Main layout */
    #main-screen { display: none; }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .topbar-title { font-size: 17px; font-weight: 800; }
    .topbar-badge { background: var(--primary-light); color: var(--primary); font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 100px; }
    .topbar-actions { display: flex; gap: 10px; align-items: center; }
    .btn-sm { background: var(--surface); border: 1.5px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .btn-sm:hover { border-color: var(--primary); color: var(--primary); }
    .btn-sm.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-sm.primary:hover { background: #E84D6E; }

    .content { padding: 24px; max-width: 1200px; margin: 0 auto; }

    /* Stats grid */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-card { background: var(--surface); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
    .stat-card-label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
    .stat-card-val { font-size: 28px; font-weight: 900; color: var(--text); }
    .stat-card-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .progress-bar { height: 6px; background: var(--border); border-radius: 100px; margin-top: 10px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #FFB347); border-radius: 100px; transition: width 0.5s; }

    /* Filter bar */
    .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .search-input { flex: 1; min-width: 180px; border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.2s; background: var(--surface); }
    .search-input:focus { border-color: var(--primary); }
    .filter-select { border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 14px; font-family: inherit; outline: none; background: var(--surface); cursor: pointer; }

    /* Profile list */
    .profile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .profile-card { background: var(--surface); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); cursor: pointer; transition: all 0.15s; }
    .profile-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.10); }
    .pc-header { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
    .pc-photo { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: var(--primary-light); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; overflow: hidden; }
    .pc-photo img { width: 100%; height: 100%; object-fit: cover; }
    .pc-name { font-size: 16px; font-weight: 800; }
    .pc-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .pc-score { margin-left: auto; text-align: right; }
    .pc-score-val { font-size: 22px; font-weight: 900; color: var(--primary); }
    .pc-score-label { font-size: 11px; color: var(--text-muted); }
    .pc-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
    .pc-tag { background: var(--bg); border-radius: 100px; padding: 3px 10px; font-size: 11px; font-weight: 600; color: var(--text-secondary); }
    .pc-detail { font-size: 13px; color: var(--text-secondary); line-height: 1.6; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
    .pc-detail-item { display: flex; flex-direction: column; }
    .pc-detail-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .pc-detail-val { font-size: 12px; font-weight: 600; color: var(--text); }
    .gender-badge { display: inline-block; padding: 2px 8px; border-radius: 100px; font-size: 11px; font-weight: 700; }
    .gender-F { background: #FFD6DF; color: #C2185B; }
    .gender-M { background: #D1E8FF; color: #1565C0; }

    /* Empty / loading */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .loading-spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 40px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Modal */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal { background: var(--surface); border-radius: var(--radius); max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 28px; }
    .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
    .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); padding: 4px; }
    .modal-photo { width: 100%; max-height: 260px; object-fit: cover; border-radius: 10px; margin-bottom: 20px; }
    .modal-section { margin-bottom: 18px; }
    .modal-section-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; margin-bottom: 10px; }
    .modal-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .modal-row:last-child { border-bottom: none; }
    .modal-row-label { color: var(--text-muted); }
    .modal-row-val { font-weight: 600; text-align: right; max-width: 60%; word-break: break-all; }
    .contact-reveal { background: #FFF4F4; border-radius: 8px; padding: 10px 14px; font-size: 14px; font-weight: 700; color: #C62828; margin-top: 8px; display: flex; align-items: center; gap: 8px; }

    /* Toast */
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: #fff; padding: 10px 20px; border-radius: 100px; font-size: 14px; font-weight: 600; opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 9999; white-space: nowrap; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 600px) {
      .content { padding: 16px; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .profile-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-icon">🔒</div>
    <div class="login-title">관리자 로그인</div>
    <div class="login-sub">ADMIN_SECRET을 입력해주세요</div>
    <input type="password" class="login-input" id="secret-input" placeholder="관리자 비밀키" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">로그인</button>
  </div>
</div>

<!-- Main -->
<div id="main-screen">
  <div class="topbar">
    <div>
      <span class="topbar-title">AI Charm Match 관리</span>
      <span class="topbar-badge" id="top-badge">로딩 중...</span>
    </div>
    <div class="topbar-actions">
      <button class="btn-sm" onclick="loadData()">↻ 새로고침</button>
      <button class="btn-sm primary" onclick="downloadCSV()">⬇ CSV</button>
    </div>
  </div>
  <div class="content">
    <div class="stats-grid" id="stats-grid">
      <div class="loading-spinner"></div>
    </div>
    <div class="filter-bar">
      <input type="text" class="search-input" id="search-input" placeholder="닉네임, 지역, 직업으로 검색..." oninput="filterProfiles()">
      <select class="filter-select" id="gender-filter" onchange="filterProfiles()">
        <option value="">전체 성별</option>
        <option value="F">여성</option>
        <option value="M">남성</option>
      </select>
    </div>
    <div class="profile-grid" id="profile-grid">
      <div class="loading-spinner"></div>
    </div>
  </div>
</div>

<!-- Profile Modal -->
<div class="modal-backdrop" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title">프로필 상세 <button class="modal-close" onclick="closeModal()">✕</button></div>
    <img id="modal-photo" class="modal-photo" style="display:none" alt="프로필 사진">
    <div id="modal-content"></div>
  </div>
</div>

<div id="toast"></div>

<script>
let adminSecret = '';
let allProfiles = [];

function doLogin() {
  const val = document.getElementById('secret-input').value.trim();
  if (!val) { showToast('비밀키를 입력해주세요.'); return; }
  adminSecret = val;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = '';
  loadData();
}

async function loadData() {
  await Promise.all([loadStats(), loadProfiles()]);
}

async function loadStats() {
  try {
    const res = await fetch('/api/admin/stats', { headers: { 'x-admin-secret': adminSecret } });
    if (res.status === 401) { logout(); return; }
    const d = await res.json();
    const pct = Math.min(100, Math.round((d.total / 20) * 100));
    document.getElementById('top-badge').textContent = `등록 ${d.total}명`;
    document.getElementById('stats-grid').innerHTML = `
      <div class="stat-card">
        <div class="stat-card-label">총 등록자</div>
        <div class="stat-card-val">${d.total}명</div>
        <div class="stat-card-sub">목표까지 ${d.remaining}명 남음</div>
        <div class="progress-bar"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">평균 매력 점수</div>
        <div class="stat-card-val">${d.avgScore}점</div>
        <div class="stat-card-sub">전체 평균</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">분석 횟수</div>
        <div class="stat-card-val">${d.analyzeCount}</div>
        <div class="stat-card-sub">/ 200회 한도</div>
      </div>
      ${Object.entries(d.genderStats || {}).map(([g, n]) => `
        <div class="stat-card">
          <div class="stat-card-label">${g === 'F' ? '여성' : '남성'}</div>
          <div class="stat-card-val">${n}명</div>
        </div>`).join('')}
      ${Object.entries(d.cityStats || {}).slice(0,3).map(([city, n]) => `
        <div class="stat-card">
          <div class="stat-card-label">${city}</div>
          <div class="stat-card-val">${n}명</div>
          <div class="stat-card-sub">지역</div>
        </div>`).join('')}
    `;
  } catch (e) { showToast('통계 로드 실패'); }
}

async function loadProfiles() {
  try {
    const res = await fetch(`/api/admin/profiles?limit=100`, { headers: { 'x-admin-secret': adminSecret } });
    if (res.status === 401) { logout(); return; }
    const d = await res.json();
    allProfiles = d.items || [];
    renderProfiles(allProfiles);
  } catch (e) { showToast('목록 로드 실패'); }
}

const AGE_LABELS = { '20s_early':'20대 초반','20s_mid':'20대 중반','20s_late':'20대 후반','30s_early':'30대 초반','30s_mid':'30대 중반','30s_late':'30대 후반','40s_early':'40대 초반','40s_mid':'40대 중반','40s_late':'40대 후반' };
const CONTACT_LABELS = { sms:'문자', kakao:'카카오톡', email:'이메일', manual:'직접확인' };
const HEIGHT_LABELS = { '150s':'150cm대','160_early':'160 초반','160_late':'160 후반','170_early':'170 초반','170_late':'170 후반','180+':'180+','private':'비공개' };

function renderProfiles(profiles) {
  const grid = document.getElementById('profile-grid');
  if (!profiles.length) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-icon">🌸</div><p>아직 등록된 사람이 없어요.</p></div>`;
    return;
  }
  grid.innerHTML = profiles.map(p => {
    const photoIcon = p.photoUrl ? `<img src="${p.photoUrl}" onerror="this.style.display='none'" alt="">` : '🤳';
    return `
    <div class="profile-card" onclick="openModal('${p.id}')">
      <div class="pc-header">
        <div class="pc-photo">${photoIcon}</div>
        <div>
          <div class="pc-name">${esc(p.nickname)} <span class="gender-badge gender-${p.gender}">${p.gender === 'F' ? '여' : '남'}</span></div>
          <div class="pc-meta">${AGE_LABELS[p.ageBand] || p.ageBand || '-'} · ${esc(p.city) || '-'}</div>
        </div>
        <div class="pc-score">
          <div class="pc-score-val">${p.score}</div>
          <div class="pc-score-label">점 · 상위 ${p.percentile}%</div>
        </div>
      </div>
      <div class="pc-tags">
        ${p.job ? `<span class="pc-tag">${esc(p.job)}</span>` : ''}
        ${p.heightBand ? `<span class="pc-tag">${HEIGHT_LABELS[p.heightBand] || p.heightBand}</span>` : ''}
        ${p.contactMethod ? `<span class="pc-tag">${CONTACT_LABELS[p.contactMethod] || p.contactMethod}</span>` : ''}
      </div>
      <div class="pc-detail">
        <div class="pc-detail-item"><span class="pc-detail-label">연락방법</span><span class="pc-detail-val">${CONTACT_LABELS[p.contactMethod] || '-'}</span></div>
        <div class="pc-detail-item"><span class="pc-detail-label">등록일시</span><span class="pc-detail-val">${new Date(p.createdAt).toLocaleDateString('ko-KR')}</span></div>
      </div>
    </div>`;
  }).join('');
}

function filterProfiles() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const g = document.getElementById('gender-filter').value;
  const filtered = allProfiles.filter(p => {
    const matchQ = !q || (p.nickname||'').toLowerCase().includes(q) || (p.city||'').toLowerCase().includes(q) || (p.job||'').toLowerCase().includes(q);
    const matchG = !g || p.gender === g;
    return matchQ && matchG;
  });
  renderProfiles(filtered);
}

function openModal(id) {
  const p = allProfiles.find(x => x.id === id);
  if (!p) return;

  const photoEl = document.getElementById('modal-photo');
  if (p.photoUrl) {
    // Request signed photo URL
    fetch(`/api/admin/photo?id=${id}&action=sign`, { headers: { 'x-admin-secret': adminSecret } })
      .then(r => r.json())
      .then(d => { if (d.url) { photoEl.src = d.url; photoEl.style.display = ''; } })
      .catch(() => {});
  } else {
    photoEl.style.display = 'none';
  }

  const DATE_LABELS = { cherry_blossom:'벚꽃길 산책', exhibition:'전시회와 카페', food:'맛집 탐험', wine:'와인바', hangang:'한강 피크닉' };
  const PERS_LABELS = { bold:'먼저 말거는 편', slow:'천천히 친해지는 편', playful:'장난 많고 편한 편', caring:'다정하고 챙기는 편' };

  document.getElementById('modal-content').innerHTML = `
    <div class="modal-section">
      <div class="modal-section-title">기본 정보</div>
      ${row('닉네임', p.nickname)} ${row('성별', p.gender === 'F' ? '여성' : '남성')}
      ${row('연령대', AGE_LABELS[p.ageBand] || p.ageBand)} ${row('지역', p.city)}
      ${row('직업', p.job)} ${row('키', HEIGHT_LABELS[p.heightBand] || p.heightBand)}
    </div>
    <div class="modal-section">
      <div class="modal-section-title">AI 분석 결과</div>
      ${row('매력 점수', p.score + '점')} ${row('상위', p.percentile + '%')}
      ${row('성향 타입', p.personalityType)} ${row('데이트 스타일', p.dateStyle)}
    </div>
    <div class="modal-section">
      <div class="modal-section-title">성향 & 취향</div>
      ${row('연애 성향', PERS_LABELS[p.datingPersonality] || p.datingPersonality)}
      ${row('첫 데이트', DATE_LABELS[p.firstDatePref] || p.firstDatePref)}
      ${row('밸런스1', p.balanceLooksHeight)} ${row('밸런스2', p.balanceCareerMoney)}
      ${row('밸런스3', p.balanceChemistryStability)}
    </div>
    <div class="modal-section">
      <div class="modal-section-title">우선순위</div>
      ${row('외모/분위기', p.priorityAppearance + '%')} ${row('키/피지컬', p.priorityHeight + '%')}
      ${row('재력/경제력', p.priorityWealth + '%')} ${row('직업/능력', p.priorityCareer + '%')}
    </div>
    <div class="modal-section">
      <div class="modal-section-title">연락처 (관리자 전용)</div>
      <div class="contact-reveal">
        📞 ${CONTACT_LABELS[p.contactMethod] || p.contactMethod}: ${p.contact || '—'}
        <button class="btn-sm" onclick="navigator.clipboard.writeText('${esc(p.contact || '')}').then(()=>showToast('복사됨'))">복사</button>
      </div>
      ${p.extraMemo ? `<div style="margin-top:12px;font-size:14px;color:var(--text-secondary);line-height:1.6;background:var(--bg);padding:12px;border-radius:8px">${esc(p.extraMemo)}</div>` : ''}
    </div>
    <div class="modal-section">
      <div class="modal-section-title">메타</div>
      ${row('등록일시', new Date(p.createdAt).toLocaleString('ko-KR'))}
      ${row('알림 동의', p.consentNotification ? '동의' : '비동의')}
      ${row('ID', p.id)}
    </div>
  `;
  document.getElementById('modal').style.display = 'flex';
}

function row(label, val) {
  if (!val && val !== 0) return '';
  return `<div class="modal-row"><span class="modal-row-label">${label}</span><span class="modal-row-val">${esc(String(val))}</span></div>`;
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
  document.getElementById('modal-photo').src = '';
  document.getElementById('modal-photo').style.display = 'none';
}

async function downloadCSV() {
  showToast('CSV 다운로드 중...');
  const res = await fetch(`/api/admin/csv?s=${encodeURIComponent(adminSecret)}`);
  if (res.status === 401) { logout(); return; }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `charm-match-${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);
}

function logout() {
  adminSecret = '';
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  showToast('인증이 만료됐어요. 다시 로그인해주세요.');
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

document.getElementById('secret-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
