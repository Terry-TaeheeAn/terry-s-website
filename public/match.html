<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>매칭 — 설렘</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --coral: #FF5A78; --coral-deep: #E03B5E; --peach: #FFB07A;
      --ok: #3FB984; --plum: #1A0F18; --plum-2: #4A3540;
      --bg: #F7F3EE; --surface: #fff; --sand: #EDDFD2; --sand-2: #E0D0C0;
      --text: var(--plum); --text-muted: #9A8674;
    }
    html, body { height: 100%; font-family: 'Pretendard', -apple-system, sans-serif; background: var(--plum); color: #fff; overflow: hidden; }
    .wrap { max-width: 480px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; padding: 0 20px; }

    /* Topbar */
    .topbar { padding: 52px 0 16px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .ai-chip { display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; background:rgba(255,255,255,.12); font-family:'Bricolage Grotesque',sans-serif; font-weight:600; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.8); }
    .ai-chip-dot { width:6px; height:6px; border-radius:50%; background:var(--coral); animation:pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }
    .top-link { font-family:'Bricolage Grotesque',sans-serif; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.5); text-decoration:none; }

    /* Story bar */
    .story-bar { display:flex; gap:4px; margin-bottom:16px; flex-shrink:0; }
    .story-seg { flex:1; height:2px; background:rgba(255,255,255,.2); border-radius:999px; overflow:hidden; }
    .story-seg.done { background:rgba(255,255,255,.7); }
    .story-seg.active { background:rgba(255,255,255,.2); }
    .story-seg.active .story-fill { height:100%; background:#fff; border-radius:999px; width:0%; transition:width .1s linear; }

    /* Card stack */
    .stage { flex:1; position:relative; min-height:0; }
    .swipe-card {
      position:absolute; inset:0; border-radius:24px; overflow:hidden;
      box-shadow:0 20px 60px rgba(0,0,0,.5);
      background:var(--plum-2);
      will-change:transform;
      touch-action:none;
      cursor:grab;
    }
    .swipe-card:active { cursor:grabbing; }
    .card-photo { position:absolute; inset:0; background:center/cover no-repeat var(--plum-2); }
    .card-photo-placeholder { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:80px; opacity:.15; }
    .card-gradient { position:absolute; inset:0; background:linear-gradient(to top, rgba(26,15,24,.92) 0%, rgba(26,15,24,.4) 45%, transparent 70%); }

    /* Face corners */
    .fc { position:absolute; width:18px; height:18px; border-color:rgba(255,90,120,.5); border-style:solid; }
    .fc.tl { top:14px; left:14px; border-width:2px 0 0 2px; }
    .fc.tr { top:14px; right:14px; border-width:2px 2px 0 0; }
    .fc.bl { bottom:14px; left:14px; border-width:0 0 2px 2px; }
    .fc.br { bottom:14px; right:14px; border-width:0 2px 2px 0; }

    /* Score chips on card */
    .card-chips { position:absolute; top:16px; right:16px; display:flex; flex-direction:column; gap:6px; align-items:flex-end; z-index:3; }
    .chip-score { padding:5px 10px; border-radius:999px; background:rgba(26,15,24,.7); backdrop-filter:blur(8px); font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:12px; color:#fff; letter-spacing:.04em; font-variant-numeric:tabular-nums; }
    .chip-fit { padding:5px 10px; border-radius:999px; background:rgba(63,185,132,.2); backdrop-filter:blur(8px); font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:10px; color:var(--ok); letter-spacing:.1em; text-transform:uppercase; }

    /* Card content */
    .card-content { position:absolute; left:0; right:0; bottom:0; padding:20px 20px 24px; z-index:3; }
    .card-location { font-family:'Bricolage Grotesque',sans-serif; font-size:10px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.6); margin-bottom:6px; }
    .card-name { font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:38px; line-height:1; letter-spacing:-.04em; color:#fff; }
    .card-name em { font-family:'Instrument Serif',serif; font-style:italic; color:var(--peach); font-size:28px; font-weight:400; }
    .card-meta-row { font-size:13px; color:rgba(255,255,255,.65); margin-top:6px; }

    /* LIKE / NOPE overlays */
    .swipe-overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:10; pointer-events:none; opacity:0; transition:opacity .1s; }
    .overlay-like { background:linear-gradient(135deg, rgba(63,185,132,.35), transparent); }
    .overlay-nope { background:linear-gradient(225deg, rgba(255,90,120,.35), transparent); }
    .overlay-text { font-family:'Instrument Serif',serif; font-style:italic; font-size:72px; font-weight:400; letter-spacing:-.02em; text-shadow:0 2px 20px rgba(0,0,0,.3); }
    .overlay-like .overlay-text { color:#fff; transform:rotate(-12deg); }
    .overlay-nope .overlay-text { color:var(--coral); transform:rotate(12deg); }

    /* Actions */
    .actions { display:flex; gap:14px; padding:14px 0 32px; justify-content:center; align-items:center; flex-shrink:0; }
    .btn-pass { width:58px; height:58px; border-radius:50%; border:2px solid rgba(255,255,255,.15); background:rgba(255,255,255,.08); color:rgba(255,255,255,.6); font-size:22px; cursor:pointer; backdrop-filter:blur(8px); transition:transform .15s, background .15s; }
    .btn-pass:active { transform:scale(.92); background:rgba(255,90,120,.2); }
    .btn-like { height:58px; padding:0 28px; border-radius:999px; border:none; background:linear-gradient(135deg, var(--coral), var(--peach)); color:#fff; font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:15px; letter-spacing:.04em; cursor:pointer; box-shadow:0 8px 24px rgba(255,90,120,.4); transition:transform .15s, box-shadow .15s; display:flex; align-items:center; gap:8px; }
    .btn-like:active { transform:scale(.95); box-shadow:0 4px 12px rgba(255,90,120,.3); }

    /* Empty / loading */
    .empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 24px; }
    .empty .emo { font-size:52px; margin-bottom:16px; }
    .empty .t { font-family:'Bricolage Grotesque',sans-serif; font-size:20px; font-weight:700; margin-bottom:8px; }
    .empty .s { font-size:14px; color:rgba(255,255,255,.5); line-height:1.6; }
    .empty a, .empty button { display:inline-block; margin-top:20px; background:var(--coral); color:#fff; border:none; padding:13px 24px; border-radius:999px; font-family:'Bricolage Grotesque',sans-serif; font-size:13px; font-weight:700; letter-spacing:.06em; text-decoration:none; cursor:pointer; }

    /* Match modal */
    .modal-back { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:flex-end; justify-content:center; z-index:99; }
    .modal-back.show { display:flex; }
    .modal { background:var(--bg); border-radius:24px 24px 0 0; width:100%; max-width:480px; padding:28px 24px 48px; color:var(--plum); }
    .modal-handle { width:36px; height:4px; background:var(--sand-2); border-radius:999px; margin:0 auto 20px; }
    .modal-eyebrow { font-family:'Bricolage Grotesque',sans-serif; font-size:10px; font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px; text-align:center; }
    .modal-headline { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:28px; text-align:center; line-height:1.2; margin-bottom:4px; }
    .modal-headline em { font-family:'Instrument Serif',serif; font-style:italic; color:var(--coral); }
    .modal-ai-note { background:var(--surface); border-radius:14px; padding:14px 16px; margin:16px 0; }
    .modal-ai-note-tag { font-family:'Bricolage Grotesque',sans-serif; font-size:10px; font-weight:600; letter-spacing:.2em; color:#9A8674; text-transform:uppercase; margin-bottom:5px; }
    .modal-ai-note-body { font-family:'Instrument Serif',serif; font-style:italic; font-size:15px; line-height:1.5; color:var(--plum); }
    .contact-box { background:var(--sand); border-radius:12px; padding:14px 16px; font-size:14px; margin-bottom:16px; }
    .contact-box strong { display:block; font-family:'Bricolage Grotesque',sans-serif; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-muted); margin-bottom:4px; }
    .contact-box span { font-weight:600; color:var(--plum); font-size:15px; }
    .modal-btn-primary { width:100%; padding:16px; border:none; border-radius:14px; font-family:'Bricolage Grotesque',sans-serif; font-size:15px; font-weight:700; cursor:pointer; background:linear-gradient(135deg,var(--coral),var(--peach)); color:#fff; margin-bottom:10px; letter-spacing:.02em; }
    .modal-btn-secondary { width:100%; padding:14px; border:none; border-radius:14px; font-family:'Bricolage Grotesque',sans-serif; font-size:14px; font-weight:600; cursor:pointer; background:var(--sand); color:var(--plum-2); }

    #toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px); background:rgba(255,255,255,.15); backdrop-filter:blur(12px); color:#fff; padding:12px 20px; border-radius:100px; font-size:13px; font-weight:600; opacity:0; transition:all .3s; z-index:200; white-space:nowrap; }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="ai-chip"><span class="ai-chip-dot"></span><span id="chip-label">AI · MATCHING</span></div>
    <a class="top-link" href="/matches">받은 매칭</a>
  </div>
  <div class="story-bar" id="story-bar"></div>
  <div class="stage" id="stage">
    <div class="empty" id="loading">
      <div class="emo">⏳</div>
      <div class="t">후보를 불러오는 중</div>
      <div class="s">AI가 당신과 잘 맞는 상대를<br>찾고 있어요</div>
    </div>
  </div>
  <div class="actions" id="actions" style="display:none">
    <button class="btn-pass" onclick="doSwipe('pass')" id="btn-pass">✕</button>
    <button class="btn-like" onclick="doSwipe('like')" id="btn-like">♥ &nbsp;좋아요</button>
  </div>
</div>

<div class="modal-back" id="match-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-eyebrow">AI · MATCHED · FIT <span id="modal-fit">-</span></div>
    <div class="modal-headline">AI가 이어준<br><em>오늘의 한 사람.</em></div>
    <div class="modal-ai-note">
      <div class="modal-ai-note-tag">AI · OPENER</div>
      <div class="modal-ai-note-body" id="modal-opener">첫 메시지를 보내보세요.</div>
    </div>
    <div class="contact-box">
      <strong id="contact-label">연락처</strong>
      <span id="contact-value"></span>
    </div>
    <button class="modal-btn-primary" onclick="closeMatchModal()">계속 매칭하기</button>
    <button class="modal-btn-secondary" onclick="location.href='/matches'">매칭 목록 보기</button>
  </div>
</div>

<div id="toast"></div>

<script>
const auth = (() => {
  const saved = JSON.parse(localStorage.getItem('charm_registrations') || '[]');
  return saved.length ? saved[saved.length - 1] : null;
})();

if (!auth) {
  document.getElementById('stage').innerHTML = `
    <div class="empty">
      <div class="emo">📝</div>
      <div class="t">먼저 등록이 필요해요</div>
      <div class="s">매력 테스트 후 사전등록을<br>완료해주세요.</div>
      <a href="/">매력 테스트 시작하기</a>
    </div>`;
}

let candidates = [];
let currentIdx = 0;

// ── Story bar ──
function renderStoryBar() {
  const bar = document.getElementById('story-bar');
  if (!candidates.length) { bar.innerHTML = ''; return; }
  const total = Math.min(candidates.length, 10);
  bar.innerHTML = Array.from({length: total}, (_, i) => {
    const cls = i < currentIdx ? 'done' : i === currentIdx ? 'active' : '';
    return `<div class="story-seg ${cls}">${cls === 'active' ? '<div class="story-fill"></div>' : ''}</div>`;
  }).join('');
}

// ── Feed ──
async function loadFeed() {
  try {
    const r = await fetch('/api/matches/feed', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ myId: auth.id, myToken: auth.deleteToken, limit: 15 }),
    });
    const data = await r.json();
    if (!r.ok) {
      showEmpty(data.error === 'INVALID_TOKEN' ? '인증 정보가 만료됐어요.' : '잠시 후 다시 시도해주세요.');
      return;
    }
    candidates = data.candidates || [];
    currentIdx = 0;
    const chip = document.getElementById('chip-label');
    if (chip) chip.textContent = `AI · ${candidates.length} MATCHED`;
    renderStoryBar();
    renderCurrent();
  } catch (e) {
    showEmpty('연결을 확인하고 새로고침 해주세요.');
  }
}

function ageBandLabel(b) {
  return { '20s_early':'20대 초반','20s_mid':'20대 중반','20s_late':'20대 후반','30s_early':'30대 초반','30s_mid':'30대 중반','30s_late':'30대 후반','40s_early':'40대 초반' }[b] || '';
}
function heightBandLabel(b) {
  return { '150s':'150s','160_early':'160 초반','160_late':'160 후반','170_early':'170 초반','170_late':'170 후반','180+':'180+','private':'비공개' }[b] || '';
}

// ── Render card ──
function renderCurrent() {
  const stage = document.getElementById('stage');
  const actions = document.getElementById('actions');
  if (currentIdx >= candidates.length) {
    actions.style.display = 'none';
    stage.innerHTML = `<div class="empty"><div class="emo">🌙</div><div class="t">오늘은 여기까지예요</div><div class="s">새로운 후보가 곧 추가될 거예요.<br>내일 다시 확인해주세요.</div><button onclick="loadFeed()">새로고침</button></div>`;
    return;
  }
  actions.style.display = 'flex';
  const c = candidates[currentIdx];
  const ageLbl = ageBandLabel(c.ageBand);
  const htLbl = heightBandLabel(c.heightBand);
  const meta = [ageLbl, c.city, htLbl].filter(Boolean).join(' · ');

  stage.innerHTML = `
    <div class="swipe-card" id="swipe-card">
      <div class="card-photo" style="background-image:${c.photoUrl ? `url('${c.photoUrl}')` : 'none'}">
        <div class="card-photo-placeholder">🧑</div>
      </div>
      <div class="card-gradient"></div>
      <div class="fc tl"></div><div class="fc tr"></div><div class="fc bl"></div><div class="fc br"></div>
      <div class="card-chips">
        <div class="chip-score">${c.appearanceScore || '-'} · ${c.charmGrade}</div>
        <div class="chip-fit">FIT ${c.compatibility}</div>
      </div>
      <div class="swipe-overlay overlay-like" id="overlay-like"><div class="overlay-text">yes</div></div>
      <div class="swipe-overlay overlay-nope" id="overlay-nope"><div class="overlay-text">no</div></div>
      <div class="card-content">
        ${c.city ? `<div class="card-location">${escapeHtml(c.city)}</div>` : ''}
        <div class="card-name">${escapeHtml(c.nickname)}<em>, ${ageLbl || '-'}</em></div>
        ${meta ? `<div class="card-meta-row">${escapeHtml(meta)}</div>` : ''}
      </div>
    </div>`;

  initDrag();
  renderStoryBar();
}

// ── Drag physics ──
function initDrag() {
  const card = document.getElementById('swipe-card');
  if (!card) return;
  let startX = 0, startY = 0, curX = 0, isDragging = false;

  function onStart(e) {
    isDragging = true;
    const pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX; startY = pt.clientY; curX = 0;
    card.style.transition = 'none';
  }
  function onMove(e) {
    if (!isDragging) return;
    e.preventDefault();
    const pt = e.touches ? e.touches[0] : e;
    curX = pt.clientX - startX;
    const rotate = curX * 0.06;
    card.style.transform = `translateX(${curX}px) rotate(${rotate}deg)`;
    const ratio = Math.min(Math.abs(curX) / 80, 1);
    const likeEl = document.getElementById('overlay-like');
    const nopeEl = document.getElementById('overlay-nope');
    if (curX > 0) { if (likeEl) likeEl.style.opacity = ratio; if (nopeEl) nopeEl.style.opacity = 0; }
    else { if (nopeEl) nopeEl.style.opacity = ratio; if (likeEl) likeEl.style.opacity = 0; }
  }
  function onEnd() {
    if (!isDragging) return;
    isDragging = false;
    if (Math.abs(curX) > 90) {
      const action = curX > 0 ? 'like' : 'pass';
      const dir = curX > 0 ? 600 : -600;
      card.style.transition = 'transform .28s cubic-bezier(.2,.7,.3,1), opacity .28s';
      card.style.transform = `translateX(${dir}px) rotate(${dir * 0.06}deg)`;
      card.style.opacity = '0';
      doSwipe(action);
    } else {
      card.style.transition = 'transform .28s cubic-bezier(.2,.7,.3,1)';
      card.style.transform = '';
      const likeEl = document.getElementById('overlay-like');
      const nopeEl = document.getElementById('overlay-nope');
      if (likeEl) likeEl.style.opacity = 0;
      if (nopeEl) nopeEl.style.opacity = 0;
    }
  }
  card.addEventListener('mousedown', onStart);
  card.addEventListener('touchstart', onStart, { passive: true });
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('mouseup', onEnd);
  window.addEventListener('touchend', onEnd);
}

// ── Swipe action ──
let swiping = false;
async function doSwipe(action) {
  if (swiping) return;
  swiping = true;
  const c = candidates[currentIdx];
  if (!c) { swiping = false; return; }

  // Button animation
  const card = document.getElementById('swipe-card');
  if (card && card.style.transform === '') {
    card.style.transition = 'transform .28s cubic-bezier(.2,.7,.3,1), opacity .28s';
    card.style.transform = action === 'like' ? 'translateX(600px) rotate(36deg)' : 'translateX(-600px) rotate(-36deg)';
    card.style.opacity = '0';
  }

  try {
    const r = await fetch('/api/matches/swipe', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ myId: auth.id, myToken: auth.deleteToken, targetId: c.id, action }),
    });
    const data = await r.json();
    if (data.matched) {
      currentIdx++;
      setTimeout(() => showMatchModal(data.match, c.compatibility), 320);
      swiping = false;
      return;
    }
  } catch (e) { showToast('네트워크 오류'); }

  setTimeout(() => { currentIdx++; renderCurrent(); swiping = false; }, 300);
}

// ── Match modal ──
function showMatchModal(m, fit) {
  const methodMap = { sms:'문자', kakao:'카카오톡 ID', email:'이메일', manual:'직접 확인' };
  document.getElementById('modal-fit').textContent = fit || '-';
  document.getElementById('modal-opener').textContent = '첫 메시지를 보내 매칭을 시작해보세요.';
  document.getElementById('contact-label').textContent = `${escapeHtml(m.nickname)} 님의 ${methodMap[m.contactMethod] || '연락처'}`;
  document.getElementById('contact-value').textContent = escapeHtml(m.contact || '');
  document.getElementById('match-modal').classList.add('show');
}
function closeMatchModal() {
  document.getElementById('match-modal').classList.remove('show');
  renderCurrent();
}

function showEmpty(msg) {
  document.getElementById('actions').style.display = 'none';
  document.getElementById('stage').innerHTML = `<div class="empty"><div class="emo">⚠️</div><div class="t">불러올 수 없어요</div><div class="s">${escapeHtml(msg)}</div><button onclick="loadFeed()">다시 시도</button></div>`;
}
function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }

if (auth) loadFeed();
</script>
</body>
</html>
