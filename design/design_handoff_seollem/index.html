<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AURA · Design System & Screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html,body{margin:0;padding:0;background:#f0eee9;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;color:#2a251f}
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
  /* tokens */
  :root{
    --coral:#FF5A78;
    --coral-deep:#E03B5E;
    --peach:#FFB07A;
    --plum:#2D1F2A;
    --plum-2:#4A3540;
    --cream:#FFF8F5;
    --sand:#F5E8DE;
    --sand-2:#EDDFD2;
    --aubergine:#6B2E4E;
    --gold:#C9A36B;
    --ok:#3FB984;
    --line:rgba(45,31,42,.08);
    --line-2:rgba(45,31,42,.14);
    --shadow-card:0 1px 2px rgba(45,31,42,.04), 0 8px 24px rgba(45,31,42,.06);
    --shadow-lift:0 8px 24px rgba(255,90,120,.18), 0 2px 6px rgba(45,31,42,.06);
    --r-sm:8px; --r:14px; --r-lg:22px; --r-pill:999px;
    --serif:'Instrument Serif', 'Times New Roman', serif;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --display:'Bricolage Grotesque', 'Pretendard', sans-serif;
  }
  /* phone frame */
  .phone{width:390px;height:844px;background:var(--cream);border-radius:44px;position:relative;overflow:hidden;font-family:'Pretendard',sans-serif;color:var(--plum);box-shadow:inset 0 0 0 1px rgba(45,31,42,.08)}
  .phone .statusbar{height:46px;display:flex;align-items:center;justify-content:space-between;padding:14px 28px 0;font-size:14px;font-weight:600;color:var(--plum)}
  .phone .statusbar .icons{display:flex;gap:6px;align-items:center}
  .phone .statusbar .dot{width:4px;height:4px;border-radius:50%;background:currentColor}
  .phone .home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:rgba(45,31,42,.35)}

  /* generic */
  .ph-img{background:repeating-linear-gradient(135deg,#e8d9cc 0 8px,#dfcbbb 8px 16px);position:relative;overflow:hidden}
  .ph-img::after{content:attr(data-label);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;color:rgba(45,31,42,.45);letter-spacing:.04em;text-transform:uppercase}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;line-height:1}
  .btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:18px;background:linear-gradient(180deg,#FF6B8A 0%, #FF5A78 60%, #F2486A 100%);color:#fff;font-weight:600;font-size:16px;border:0;box-shadow:var(--shadow-lift);cursor:pointer;font-family:inherit;letter-spacing:-.01em}
  .btn-primary:active{transform:translateY(1px)}
  .btn-secondary{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border-radius:16px;background:#fff;color:var(--plum);font-weight:600;font-size:15px;border:1px solid var(--line-2);cursor:pointer;font-family:inherit}
  .btn-ghost{background:transparent;border:0;color:var(--plum-2);font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;padding:8px 10px}
  .serif{font-family:var(--serif);font-style:italic}
  .mono{font-family:var(--mono)}
  .tabular{font-variant-numeric:tabular-nums}

  /* swatch */
  .swatch{display:flex;flex-direction:column;gap:8px}
  .swatch .chip{height:80px;border-radius:14px;display:flex;align-items:flex-end;padding:10px;font-family:var(--mono);font-size:10px;letter-spacing:.04em}
  .swatch .meta{font-size:11px;color:#6a5a4a;display:flex;justify-content:space-between;font-family:var(--mono)}

  /* score ring */
  .ring-num{font-family:var(--serif);font-style:italic;font-weight:400;line-height:.85;letter-spacing:-.04em}
  /* progress */
  .pbar{height:8px;border-radius:999px;background:var(--sand-2);overflow:hidden}
  .pbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--peach),var(--coral));border-radius:999px}

  /* heart pop */
  @keyframes pop{0%{transform:scale(.4);opacity:0}50%{opacity:1}100%{transform:scale(1.6);opacity:0}}
  .hpop{animation:pop 1.4s cubic-bezier(.2,.7,.3,1) infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes count{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .countin{animation:count .6s cubic-bezier(.2,.7,.3,1) both}

  /* swipe transform on card */
  .card-shadow{box-shadow:0 12px 40px rgba(45,31,42,.18), 0 2px 6px rgba(45,31,42,.08)}

  /* docs typography */
  .doc-h{font-family:var(--serif);font-style:italic;font-size:42px;line-height:1;letter-spacing:-.02em;color:var(--plum)}
  .doc-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9a8674}
  .doc-body{font-size:14px;line-height:1.55;color:var(--plum-2)}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="brand.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="system.jsx"></script>
<script type="text/babel" src="v2.jsx"></script>
<script type="text/babel" src="v2-extra.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
